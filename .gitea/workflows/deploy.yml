name: Build & Deploy

on:
  push:
    tags:
      - 'v*'
    # branches: [main]   # 如需每次推 main 自动部署，取消此行注释
  workflow_dispatch:
    inputs:
      deploy:
        description: '是否在构建后部署到服务器'
        required: false
        default: 'true'

env:
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_API: ${{ vars.REGISTRY }}/vetta/api
  IMAGE_ADMIN: ${{ vars.REGISTRY }}/vetta/admin

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ gitea.ref_type }}" = "tag" ]; then
            echo "tag=${{ gitea.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=manual-$(echo ${{ gitea.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

  build-api:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Gitea Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build & push api
        uses: docker/build-push-action@v5
        with:
          context: packages/api
          file: packages/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ needs.meta.outputs.tag }}

  build-admin:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Gitea Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build & push admin
        uses: docker/build-push-action@v5
        with:
          context: packages/admin
          file: packages/admin/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_ADMIN }}:latest
            ${{ env.IMAGE_ADMIN }}:${{ needs.meta.outputs.tag }}

  deploy:
    needs: [meta, build-api, build-admin]
    if: ${{ gitea.event_name == 'push' || gitea.event.inputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH }}
            echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ vars.REGISTRY }} -u ${{ secrets.REGISTRY_USER }} --password-stdin
            TAG="${{ needs.meta.outputs.tag }}"
            if grep -q '^API_TAG=' .env; then
              sed -i "s|^API_TAG=.*|API_TAG=${TAG}|" .env
            else
              echo "API_TAG=${TAG}" >> .env
            fi
            if grep -q '^ADMIN_TAG=' .env; then
              sed -i "s|^ADMIN_TAG=.*|ADMIN_TAG=${TAG}|" .env
            else
              echo "ADMIN_TAG=${TAG}" >> .env
            fi
            docker compose pull api admin
            docker compose up -d api admin
            docker image prune -f
            docker compose ps
