name: Build & Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deploy:
        description: '是否在构建后部署到服务器'
        required: false
        default: 'true'

env:
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_API: ${{ vars.REGISTRY }}/vetta/api
  IMAGE_ADMIN: ${{ vars.REGISTRY }}/vetta/admin
  DOCKER_HOST: unix:///var/run/docker.sock

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ gitea.ref_type }}" = "tag" ]; then
            echo "tag=${{ gitea.ref_name }}" >> $GITHUB_OUTPUT
          else
            SHORT=$(echo "${{ gitea.sha }}" | cut -c1-7)
            echo "tag=manual-${SHORT}" >> $GITHUB_OUTPUT
          fi

  build-api:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://gitea.com/actions/checkout@v4

      - name: Login to Registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ vars.REGISTRY }} -u ${{ secrets.REGISTRY_USER }} --password-stdin

      - name: Build & push api
        run: |
          TAG=${{ needs.meta.outputs.tag }}
          docker build \
            -f packages/api/Dockerfile \
            -t ${{ env.IMAGE_API }}:latest \
            -t ${{ env.IMAGE_API }}:${TAG} \
            packages/api
          docker push ${{ env.IMAGE_API }}:latest
          docker push ${{ env.IMAGE_API }}:${TAG}

  build-admin:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://gitea.com/actions/checkout@v4

      - name: Login to Registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ vars.REGISTRY }} -u ${{ secrets.REGISTRY_USER }} --password-stdin

      - name: Build & push admin
        run: |
          TAG=${{ needs.meta.outputs.tag }}
          docker build \
            -f packages/admin/Dockerfile \
            -t ${{ env.IMAGE_ADMIN }}:latest \
            -t ${{ env.IMAGE_ADMIN }}:${TAG} \
            packages/admin
          docker push ${{ env.IMAGE_ADMIN }}:latest
          docker push ${{ env.IMAGE_ADMIN }}:${TAG}

  deploy:
    needs: [meta, build-api, build-admin]
    if: ${{ gitea.event_name == 'push' || gitea.event.inputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: |
          if ! command -v sshpass >/dev/null 2>&1; then
            apt-get update && apt-get install -y sshpass
          fi

      - name: Deploy via SSH
        env:
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          REGISTRY: ${{ vars.REGISTRY }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -p "$PORT" "$USER@$HOST" bash -s <<EOF
          set -e
          cd $DEPLOY_PATH
          echo "$REGISTRY_TOKEN" | docker login $REGISTRY -u $REGISTRY_USER --password-stdin
          if grep -q '^API_TAG=' .env; then
            sed -i "s|^API_TAG=.*|API_TAG=$TAG|" .env
          else
            echo "API_TAG=$TAG" >> .env
          fi
          if grep -q '^ADMIN_TAG=' .env; then
            sed -i "s|^ADMIN_TAG=.*|ADMIN_TAG=$TAG|" .env
          else
            echo "ADMIN_TAG=$TAG" >> .env
          fi
          docker compose pull api admin
          docker compose up -d api admin
          docker image prune -f
          docker compose ps
          EOF
