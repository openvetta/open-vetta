# Trellis Configuration
# Project-level settings for the Trellis workflow system
#
# All values have sensible defaults. Only override what you need.

#-------------------------------------------------------------------------------
# Session Recording
#-------------------------------------------------------------------------------

# Commit message used when auto-committing journal/index changes
# after running add_session.py
session_commit_message: "chore: record journal"

# Maximum lines per journal file before rotating to a new one
max_journal_lines: 2000

#-------------------------------------------------------------------------------
# Task Lifecycle Hooks
#-------------------------------------------------------------------------------

# Shell commands to run after task lifecycle events.
# Each hook receives TASK_JSON_PATH environment variable pointing to task.json.
# Hook failures print a warning but do not block the main operation.
#
# hooks:
#   after_create:
#     - "echo 'Task created'"
#   after_start:
#     - "echo 'Task started'"
#   after_finish:
#     - "echo 'Task finished'"
#   after_archive:
#     - "echo 'Task archived'"

#-------------------------------------------------------------------------------
# Monorepo / Packages
#-------------------------------------------------------------------------------

# Declare packages for monorepo projects.
# Trellis auto-detects workspaces during `trellis init`, but you can also
# configure them manually here.
#
# packages:
#   frontend:
#     path: packages/frontend
#   backend:
#     path: packages/backend
#   docs:
#     path: docs-site
#     type: submodule

# Default package used when --package is not specified.
# default_package: frontend

# Auto-detected monorepo packages
packages:
  pi-ai:
    path: packages/ai
  pi-agent-core:
    path: packages/agent
  coding-agent:
    path: packages/coding-agent
  runtime-core:
    path: packages/runtime-core
  runtime-tools:
    path: packages/runtime-tools
  runtime-mcp:
    path: packages/runtime-mcp
  runtime-storage:
    path: packages/runtime-storage
  runtime-telemetry:
    path: packages/runtime-telemetry
  cli-app:
    path: packages/cli-app
  desktop-app:
    path: packages/desktop-app
  pi-tui:
    path: packages/tui
  pi-web-ui:
    path: packages/web-ui
  pi-web-ui-example:
    path: packages/web-ui/example
  pi-extension-with-deps:
    path: packages/coding-agent/examples/extensions/with-deps
  pi-extension-custom-provider-anthropic:
    path: packages/coding-agent/examples/extensions/custom-provider-anthropic
  pi-extension-custom-provider-gitlab-duo:
    path: packages/coding-agent/examples/extensions/custom-provider-gitlab-duo
  pi-extension-custom-provider-qwen-cli:
    path: packages/coding-agent/examples/extensions/custom-provider-qwen-cli
default_package: @mariozechner/pi-ai
