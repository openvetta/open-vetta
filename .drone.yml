kind: pipeline
type: docker
name: tag-deploy

# 仅在打 tag（v 开头，如 v1.0.0）时触发
trigger:
  event:
    - tag
  ref:
    - refs/tags/v*

steps:
  - name: ssh-deploy
    image: appleboy/drone-ssh:1.8.0
    settings:
      host:
        from_secret: deploy_host
      username:
        from_secret: deploy_user
      port:
        from_secret: deploy_port
      key:
        from_secret: deploy_ssh_key
      command_timeout: 30m
      script_stop: true
      envs:
        - drone_tag
        - drone_commit
      environment:
        drone_tag: ${DRONE_TAG}
        drone_commit: ${DRONE_COMMIT_SHA}
      script:
        - cd /home/deploy/vetta-mono
        - echo ">>> deploying tag $drone_tag ($drone_commit)"
        - git fetch --all --tags --prune
        - git checkout $drone_tag
        - bash deploy/scripts/deploy.sh
        # build 完给镜像打上版本 tag 方便回滚
        - docker tag vetta-api:local vetta-api:$drone_tag
        - docker tag vetta-admin:local vetta-admin:$drone_tag

  - name: notify-failure
    image: alpine
    commands:
      - echo "deploy failed: tag=$${DRONE_TAG} commit=$${DRONE_COMMIT_SHA:0:8}"
    when:
      status:
        - failure
